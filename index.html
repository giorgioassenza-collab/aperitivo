<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regalo per Ale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column — header, name bar, your answer, the tally, then who said what */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202a; --muted:#5d6b78; --line:#dde3e9;
  --spritz:#f0561d; --spritz-soft:#fde3d8; --olive:#2f8f5b; --olive-soft:#dcf1e4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1b2228; --fg:#eef2f5; --muted:#98a6b3; --line:#2b353e;
  --spritz:#ff7a45; --spritz-soft:#3d2219; --olive:#5cc78b; --olive-soft:#1b3427; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1b2228; --fg:#eef2f5; --muted:#98a6b3; --line:#2b353e;
  --spritz:#ff7a45; --spritz-soft:#3d2219; --olive:#5cc78b; --olive-soft:#1b3427; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{color:var(--spritz)}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who input,.who select{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid transparent;padding:10px 16px}
.primary{background:var(--spritz);color:#fff}
.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--spritz);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.me{display:flex;flex-direction:column;gap:14px}
.me-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.me strong{font-family:var(--display);font-size:20px}
.question{font-family:var(--display);font-size:22px;font-weight:800;margin:0;line-height:1.2}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{padding:16px 12px;font-size:16px;background:var(--bg);border:2px solid var(--line);color:var(--fg)}
.choice[aria-pressed="true"].yes{background:var(--olive);border-color:var(--olive);color:#fff}
.choice[aria-pressed="true"].no{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.yes b{color:var(--olive)}
.groups{display:flex;flex-direction:column;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.group p{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.chip.yes{background:var(--olive-soft);border-color:transparent}
.chip.wait{border-style:dashed;color:var(--muted)}
.chip.me{font-weight:600}
.empty{font-size:14px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:1.2em;margin:0}
@media (max-width:420px){.stat b{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.choice{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Regalo per <span>Ale</span></h1>
    <p class="lede">Scegli il tuo nome e di' se partecipi al regalo.</p>
  </header>

  <section class="panel" id="namePanel">
    <p class="label">Il tuo nome</p>
    <form class="who" id="nameForm">
      <select id="nameSelect" required>
        <option value="" disabled selected>Scegli il tuo nome</option>
        <option>Andre</option><option>Gio</option><option>Luca</option><option>Matte</option><option>Matti</option><option>Vale M</option><option>Vale V</option><option>Vero</option>
        <option value="__altro">Altro…</option>
      </select>
      <input id="nameInput" placeholder="Scrivi il tuo nome" maxlength="40" hidden>
      <button class="primary" type="submit">Entra</button>
    </form>
    <p class="hint">Puoi cambiare risposta quando vuoi: scegli di nuovo il tuo nome.</p>
  </section>

  <section class="panel me" id="mePanel" hidden>
    <div class="me-top">
      <div><p class="label" style="margin:0">Rispondi come</p><strong id="meName"></strong></div>
      <button class="ghost" id="logoutBtn" type="button">Cambia nome</button>
    </div>
    <p class="question">Partecipi al regalo per Ale?</p>
    <div class="choices">
      <button class="choice yes" id="yesBtn" type="button" aria-pressed="false">Sì, partecipo</button>
      <button class="choice no" id="noBtn" type="button" aria-pressed="false">No, passo</button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <section class="panel">
    <div class="tally">
      <div class="stat yes"><b id="nYes">0</b><span>partecipano</span></div>
      <div class="stat"><b id="nNo">0</b><span>non partecipano</span></div>
      <div class="stat"><b id="nWait">0</b><span>devono rispondere</span></div>
    </div>
    <div class="groups">
      <div class="group"><p>Partecipano</p><div class="chips" id="gYes"></div></div>
      <div class="group"><p>Non partecipano</p><div class="chips" id="gNo"></div></div>
      <div class="group"><p>Devono ancora rispondere</p><div class="chips" id="gWait"></div></div>
    </div>
  </section>
  <p class="status" id="connStatus"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDMBTatFscCtpdZhsRMZG5bWzwd8aWl-3s",
  authDomain: "aperitivo-a693f.firebaseapp.com",
  projectId: "aperitivo-a693f",
  storageBucket: "aperitivo-a693f.firebasestorage.app",
  messagingSenderId: "378890285304",
  appId: "1:378890285304:web:46657997a5db9448388b0d"
};
(function(){
  const TEAM = ["Andre","Gio","Luca","Matte","Matti","Vale M","Vale V","Vero"];
  const $ = id => document.getElementById(id);
  let db = null, people = {}, me = null, saving = false;

  const slug = n => n.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "anonimo";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function store(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} }
  function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }

  function render(){
    const byName = {};
    TEAM.forEach(n => byName[n] = null);
    Object.values(people).forEach(p => { if(p.name && (p.regalo || TEAM.includes(p.name))) byName[p.name] = p.regalo || null; });
    if(me && !(me.name in byName)) byName[me.name] = null;
    const names = Object.keys(byName).sort((a,b)=>a.localeCompare(b));
    const yes = names.filter(n => byName[n]==="si"), no = names.filter(n => byName[n]==="no"), wait = names.filter(n => !byName[n]);
    $("nYes").textContent = yes.length; $("nNo").textContent = no.length; $("nWait").textContent = wait.length;
    const chips = (list, cls, emptyText) => list.length ? list.map(n => '<span class="chip '+cls+(me&&n===me.name?' me':'')+'">'+esc(n)+'</span>').join("") : '<span class="empty">'+emptyText+'</span>';
    $("gYes").innerHTML = chips(yes, "yes", "Ancora nessuno");
    $("gNo").innerHTML = chips(no, "", "Nessuno");
    $("gWait").innerHTML = chips(wait, "wait", "Hanno risposto tutti");
    if(me){
      const mine = byName[me.name];
      $("yesBtn").setAttribute("aria-pressed", mine==="si");
      $("noBtn").setAttribute("aria-pressed", mine==="no");
    }
  }

  async function answer(val){
    if(!me) return;
    if(!db){ $("status").textContent = "Collegamento non disponibile. Ricarica la pagina."; return; }
    if(saving) return;
    saving = true;
    people[me.id] = {name:me.name, regalo:val};
    render();
    $("status").textContent = "Salvo…";
    try{
      await db.doc("people/"+me.id).set({name:me.name, regalo:val, updatedAt:new Date().toISOString()});
      $("status").textContent = val==="si" ? "Salvato: partecipi al regalo." : "Salvato: non partecipi.";
    }catch(e){
      $("status").textContent = "Non sono riuscito a salvare. Riprova tra un attimo.";
    }finally{ saving = false; }
  }

  function enter(name){
    name = name.trim().replace(/\s+/g," ");
    if(!name) return;
    const id = slug(name);
    me = {id, name: people[id] ? people[id].name : name};
    store("regalo-ale-name", me.name);
    $("namePanel").hidden = true; $("mePanel").hidden = false; $("meName").textContent = me.name;
    $("status").textContent = "";
    render();
  }

  $("nameSelect").addEventListener("change", () => { const altro = $("nameSelect").value==="__altro"; $("nameInput").hidden = !altro; $("nameInput").required = altro; if(altro) $("nameInput").focus(); });
  $("nameForm").addEventListener("submit", e => { e.preventDefault(); const v = $("nameSelect").value; enter(v==="__altro" ? $("nameInput").value : v); });
  $("logoutBtn").addEventListener("click", () => { me=null; store("regalo-ale-name",null); $("namePanel").hidden=false; $("mePanel").hidden=true; $("nameInput").value=""; $("nameInput").hidden=true; $("nameSelect").selectedIndex=0; render(); });
  $("yesBtn").addEventListener("click", () => answer("si"));
  $("noBtn").addEventListener("click", () => answer("no"));

  render();
  const remembered = load("regalo-ale-name");
  try{ firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }catch(e){ db = null; }
  if(!db){ $("connStatus").textContent = "Collegamento non disponibile. Ricarica la pagina."; return; }
  let first = true;
  db.collection("people").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); if(v && v.name) next[d.id] = {name:v.name, regalo:(v.regalo==="si"||v.regalo==="no")?v.regalo:null}; });
    if(saving && me && people[me.id]) next[me.id] = people[me.id];
    people = next;
    if(first){ first=false; if(remembered && !me) enter(remembered); }
    render();
  }, () => { $("connStatus").textContent = "Collegamento perso. Ricarica la pagina."; });
})();
</script>
</body>
</html>
